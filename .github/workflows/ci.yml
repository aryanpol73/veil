name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the pipeline tests) is unflagged from Node 22.13.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix client --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependency audit, relay and root (high and critical)
        run: |
          npm audit --audit-level=high --omit=dev
          npm audit --prefix server --audit-level=high --omit=dev

      # Reported but not blocking: as of 2026-11-02 the only open high advisory
      # is zod@3 pulled in by @expo/cli (build tooling, not in the app bundle),
      # and its fix needs zod@4, which @expo/cli 57 does not support.
      - name: Dependency audit, client (report only)
        continue-on-error: true
        run: npm audit --prefix client --audit-level=high --omit=dev
